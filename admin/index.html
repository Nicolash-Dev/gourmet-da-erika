<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4b2115">
<title>Admin | Gourmet da Érika</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff8f3;color:#2d1710}
.wrap{width:min(900px,93%);margin:0 auto;padding:28px 0 70px}.top{background:#4b2115;color:#fff;padding:12px 16px;text-align:center;font-weight:900}
header{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
h1{margin:0;font-size:30px}.muted{color:#806c63}.actions{display:flex;gap:9px;flex-wrap:wrap}
button,.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer;font-size:14px}
.primary{background:#a5234e;color:#fff}.soft{background:#f3e7e0;color:#4b2115}.danger{background:#fae6e6;color:#8a2525}
.card{background:#fff;border:1px solid #eadbd1;border-radius:18px;padding:13px;margin:10px 0;display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:14px;box-shadow:0 6px 18px #3b1b100b}
.thumb{width:72px;height:72px;border-radius:13px;object-fit:cover;background:#f2e7e0}.name{font-weight:900;font-size:17px}.meta{font-size:13px;color:#806c63;margin-top:4px}
.rowactions{display:flex;align-items:center;gap:8px}.toggle{border-radius:999px;min-width:120px}.on{background:#e2f5e9;color:#17633d}.off{background:#f6e4e4;color:#8b2727}
.status{padding:12px;border-radius:12px;margin:14px 0;font-weight:700}.ok{background:#e8f6ed;color:#165f3b}.err{background:#fae6e6;color:#8a2525}.hidden{display:none}
a{color:#a5234e;font-weight:900;text-decoration:none}
.modal{position:fixed;inset:0;background:#2c160f99;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}
.sheet{width:min(540px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:22px;box-shadow:0 24px 70px #0004}
.sheet h2{margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{margin-bottom:13px}.field.full{grid-column:1/-1}
label{font-weight:800;font-size:14px}input,select{width:100%;margin-top:6px;padding:12px;border:1px solid #d8c5bb;border-radius:11px;font-size:16px;background:#fff}
.preview{width:100%;height:220px;object-fit:cover;border-radius:15px;background:#f4e9e2;display:none;margin-top:9px}.foot{display:flex;gap:9px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.switchrow{display:flex;align-items:center;gap:10px;margin-top:8px}.switchrow input{width:auto;margin:0}
@media(max-width:650px){.card{grid-template-columns:62px 1fr}.thumb{width:62px;height:62px}.rowactions{grid-column:1/-1;justify-content:stretch}.rowactions button{flex:1}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.actions{width:100%}.actions button,.actions a{flex:1;text-align:center}}
</style>
</head>
<body>
<div class="top">🔐 Área administrativa — Gourmet da Érika</div>
<main class="wrap">
<header>
 <div><h1>Produtos</h1><div class="muted">Gerencie sabores, fotos, preços e disponibilidade.</div></div>
 <div class="actions">
   <button class="primary" onclick="openNew()">＋ Adicionar produto</button>
   <a class="btn soft" href="/">Ver loja</a>
   <button class="soft" onclick="logout()">Sair</button>
 </div>
</header>
<div id="status" class="status hidden"></div>
<div id="list"><p class="muted">Carregando produtos...</p></div>
</main>

<div class="modal" id="modal">
 <div class="sheet">
  <h2 id="modalTitle">Novo produto</h2>
  <form id="productForm">
   <input type="hidden" id="pid">
   <input type="hidden" id="existingImage">
   <div class="grid">
    <div class="field full"><label>Nome do produto<input id="name" maxlength="80" required placeholder="Ex.: Ninho com Morango"></label></div>
    <div class="field"><label>Categoria
      <select id="cat"><option>Geladinho</option><option>Picolé</option><option>Sobremesa</option><option>Outro</option></select>
    </label></div>
    <div class="field"><label>Preço (R$)<input id="price" inputmode="decimal" required placeholder="7,00"></label></div>
    <div class="field full"><label>Foto<input id="photo" type="file" accept="image/*" capture="environment"></label>
      <div class="muted" style="font-size:12px;margin-top:6px">A foto será reduzida automaticamente antes de salvar.</div>
      <img id="preview" class="preview" alt="Prévia da foto">
    </div>
    <div class="field full">
      <label class="switchrow"><input id="available" type="checkbox" checked> Produto disponível</label>
    </div>
   </div>
   <div class="foot">
    <button type="button" class="soft" onclick="closeModal()">Cancelar</button>
    <button type="button" id="deleteBtn" class="danger hidden" onclick="deleteProduct()">Excluir</button>
    <button type="submit" class="primary" id="saveBtn">Salvar produto</button>
   </div>
  </form>
 </div>
</div>

<script>
const money=v=>Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
let products=[], pendingImage="";

function statusMsg(msg,ok=true){
 const box=document.getElementById("status");
 box.textContent=msg; box.className="status "+(ok?"ok":"err");
 setTimeout(()=>box.className="status hidden",2500);
}

async function load(){
 try{
  const r=await fetch("/admin-api/products",{cache:"no-store"});
  const d=await r.json();
  if(!r.ok||!d.ok) throw new Error();
  products=d.products; render();
 }catch(e){
  document.getElementById("list").innerHTML="<p class='status err'>Não foi possível carregar os produtos.</p>";
 }
}

function render(){
 const box=document.getElementById("list"); box.innerHTML="";
 products.forEach(p=>{
  const el=document.createElement("div"); el.className="card";
  el.innerHTML=`<img class="thumb" src="${imageSrc(p.img)}" alt="">
  <div><div class="name">${escapeHtml(p.name)}</div><div class="meta">${escapeHtml(p.cat)} • ${money(p.price)}</div></div>
  <div class="rowactions">
   <button class="toggle ${p.available?'on':'off'}" onclick="toggleProduct(${p.id})">${p.available?'● Disponível':'● Indisponível'}</button>
   <button class="soft" onclick="openEdit(${p.id})">Editar</button>
  </div>`;
  box.appendChild(el);
 });
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function imageSrc(src){
 if(!src) return "";
 if(src.startsWith("data:image/")) return src;
 if(src.startsWith("/")) return src;
 if(src.startsWith("assets/")) return "/" + src;
 return src;
}


async function api(body){
 const r=await fetch("/admin-api/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 const d=await r.json();
 if(!r.ok||!d.ok) throw new Error(d.error||"Não foi possível salvar.");
 return d;
}

async function toggleProduct(id){
 const p=products.find(x=>x.id===id); if(!p)return;
 try{await api({action:"toggle",id,available:!p.available});p.available=!p.available;render();statusMsg(p.name+" atualizado.");}
 catch(e){statusMsg(e.message,false)}
}

function openNew(){
 document.getElementById("modalTitle").textContent="Adicionar produto";
 document.getElementById("pid").value="";
 document.getElementById("name").value="";
 document.getElementById("cat").value="Geladinho";
 document.getElementById("price").value="";
 document.getElementById("available").checked=true;
 document.getElementById("existingImage").value="";
 document.getElementById("photo").value="";
 pendingImage="";
 const pr=document.getElementById("preview");pr.style.display="none";pr.removeAttribute("src");
 document.getElementById("deleteBtn").classList.add("hidden");
 document.getElementById("modal").classList.add("show");
}

function openEdit(id){
 const p=products.find(x=>x.id===id);if(!p)return;
 document.getElementById("modalTitle").textContent="Editar produto";
 document.getElementById("pid").value=p.id;
 document.getElementById("name").value=p.name;
 document.getElementById("cat").value=p.cat;
 document.getElementById("price").value=String(p.price).replace(".",",");
 document.getElementById("available").checked=p.available;
 document.getElementById("existingImage").value=p.img;
 document.getElementById("photo").value="";
 pendingImage="";
 const pr=document.getElementById("preview");pr.src=imageSrc(p.img);pr.style.display="block";
 document.getElementById("deleteBtn").classList.remove("hidden");
 document.getElementById("modal").classList.add("show");
}

function closeModal(){document.getElementById("modal").classList.remove("show")}

async function compressImage(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>{
   const img=new Image();
   img.onload=()=>{
    const max=900, scale=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let data=c.toDataURL("image/webp",0.72);
    if(!data.startsWith("data:image/webp")) data=c.toDataURL("image/jpeg",0.72);
    resolve(data);
   }; img.onerror=reject; img.src=reader.result;
  };reader.onerror=reject;reader.readAsDataURL(file);
 });
}

document.getElementById("photo").addEventListener("change",async(e)=>{
 const file=e.target.files?.[0];if(!file)return;
 if(!file.type.startsWith("image/")){statusMsg("Selecione uma imagem.",false);return}
 try{
  pendingImage=await compressImage(file);
  if(pendingImage.length>590000){statusMsg("Foto grande demais. Escolha uma imagem menor.",false);pendingImage="";return}
  const pr=document.getElementById("preview");pr.src=pendingImage;pr.style.display="block";
 }catch{statusMsg("Não foi possível processar a foto.",false)}
});

document.getElementById("productForm").addEventListener("submit",async(e)=>{
 e.preventDefault();
 const id=document.getElementById("pid").value;
 const name=document.getElementById("name").value.trim();
 const cat=document.getElementById("cat").value;
 const price=Number(document.getElementById("price").value.replace(",","."));
 const img=pendingImage||document.getElementById("existingImage").value;
 const available=document.getElementById("available").checked;
 const btn=document.getElementById("saveBtn");btn.disabled=true;btn.textContent="Salvando...";
 try{
  await api({action:id?"update":"create",id:id?Number(id):undefined,name,cat,price,img,available});
  closeModal();await load();statusMsg(id?"Produto atualizado.":"Produto adicionado.");
 }catch(ex){statusMsg(ex.message,false)}
 finally{btn.disabled=false;btn.textContent="Salvar produto"}
});

async function deleteProduct(){
 const id=Number(document.getElementById("pid").value);if(!id)return;
 const p=products.find(x=>x.id===id);
 if(!confirm(`Excluir "${p?.name||"este produto"}"?`))return;
 try{await api({action:"delete",id});closeModal();await load();statusMsg("Produto excluído.");}
 catch(e){statusMsg(e.message,false)}
}

async function logout(){await fetch("/api/admin-logout",{method:"POST"});location.href="/login/"}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
load();
</script>
</body>
</html>
